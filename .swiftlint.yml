included:
  - Sources
  - Tests
  - FloconDemo

excluded:
  - .build
  - "**/.build"

disabled_rules:
  - trailing_comma
  - multiple_closures_with_trailing_closure
  - nesting
  - static_over_final_class
  - optional_data_string_conversion

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 180
  error: 250
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 400
  error: 800

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 100
  error: 120

large_tuple:
  warning: 4
  error: 6

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 2
  excluded: [id, x, y, c]
