name: SwiftLint

on:
  pull_request:
    paths:
      - "**/*.swift"
      - ".swiftlint.yml"
      - ".github/workflows/swiftlint.yml"

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
